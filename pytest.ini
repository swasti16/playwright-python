[pytest]
addopts = -v --tb=short --browser=chromium -n 3 --alluredir=allure-results
markers =
    smoke: critical path tests, run on every commit
    regression: full regression suite
    visual: visual comparison tests
    flaky: tests known to be flaky, monitored separately
    knownbugs: known bugs
    eco: tests requiring an eco-friendly product, product_page auto-sourced via get_eco_product_id
testpaths = tests